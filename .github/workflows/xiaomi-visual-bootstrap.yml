name: Xiaomi inspired visual bootstrap

on:
  push:
    branches:
      - feature/xiaomi-inspired-ui

permissions:
  contents: write

jobs:
  visual-system-fix:
    if: contains(github.event.head_commit.message, 'bootstrap xiaomi visual system fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/xiaomi-inspired-ui

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix action rendering and icon font collision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          old = 'eval_res.recommended_actions[0].value'
          new = 'eval_res.recommended_actions[0].action.value'
          if old not in text:
              raise SystemExit('RecommendedAction display bug anchor not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          theme = Path('src/channel_governance/ui_theme.py')
          css = theme.read_text(encoding='utf-8')
          old_font = 'html, body, [class*="st-"] {'
          new_font = 'html, body, [data-testid="stAppViewContainer"], [data-testid="stSidebar"] {'
          if old_font not in css:
              raise SystemExit('Global font selector anchor not found')
          theme.write_text(css.replace(old_font, new_font, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression suite
        run: python -m pytest

      - name: Compile
        run: python -m compileall -q app.py src

      - name: Streamlit health check
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$pid" || true
          if [ "$ok" -ne 1 ]; then
            cat /tmp/streamlit.log
            exit 1
          fi

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Felix-0521'
          git config user.email 'felixfan0521@outlook.com'
          git add app.py src/channel_governance/ui_theme.py
          git diff --cached --check
          git commit -m 'fix: repair data center action rendering and expander icon'
          git push origin HEAD:feature/xiaomi-inspired-ui
