name: Xiaomi inspired visual bootstrap

on:
  push:
    branches:
      - feature/xiaomi-inspired-ui

permissions:
  contents: write

jobs:
  visual-system:
    if: contains(github.event.head_commit.message, 'bootstrap xiaomi visual system')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/xiaomi-inspired-ui

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build presentation-only visual system
        shell: bash
        run: |
          set -euo pipefail
          cat > src/channel_governance/ui_theme.py <<'PY'
          """Presentation-only visual system for the Streamlit prototype.

          The theme translates Xiaomi / HyperOS-inspired principles such as
          clear hierarchy, comfortable spacing, restrained surfaces and a small
          orange accent into an enterprise dashboard. It changes presentation
          only and never touches governance or scoring behavior.
          """

          import streamlit as st


          def apply_visual_theme() -> None:
              """Apply typography, spacing, surfaces and component styling."""
              st.markdown(
                  """
                  <style>
                  :root {
                    --mi-bg: #f7f7f7;
                    --mi-surface: #ffffff;
                    --mi-soft: #f2f2f2;
                    --mi-text: #191919;
                    --mi-text-2: #5f5f5f;
                    --mi-muted: #8a8a8a;
                    --mi-line: #e8e8e8;
                    --mi-accent: #ff6900;
                    --mi-radius-xl: 20px;
                    --mi-radius-lg: 16px;
                    --mi-radius-md: 12px;
                  }

                  html, body, [class*="st-"] {
                    font-family: "MiSans", "Inter", "SF Pro Display", "Segoe UI",
                      "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
                  }

                  [data-testid="stAppViewContainer"] {
                    background: var(--mi-bg);
                    color: var(--mi-text);
                  }

                  [data-testid="stHeader"] {
                    background: rgba(247,247,247,.86);
                    backdrop-filter: blur(18px);
                    -webkit-backdrop-filter: blur(18px);
                  }

                  [data-testid="stSidebar"] {
                    background: #f1f1f1;
                    border-right: 1px solid var(--mi-line);
                  }

                  .block-container {
                    max-width: 1480px;
                    padding-top: 34px;
                    padding-bottom: 64px;
                    padding-left: clamp(20px, 3.2vw, 52px);
                    padding-right: clamp(20px, 3.2vw, 52px);
                  }

                  h1, h2, h3, h4, h5, h6 {
                    color: var(--mi-text);
                    letter-spacing: -0.02em;
                  }

                  h1 {
                    font-size: clamp(31px, 2.5vw, 39px) !important;
                    line-height: 1.16 !important;
                    font-weight: 650 !important;
                    letter-spacing: -0.035em !important;
                    margin: 2px 0 8px 0 !important;
                  }

                  h1::before {
                    content: "CHANNEL GOVERNANCE / DECISION SUPPORT";
                    display: block;
                    color: var(--mi-accent);
                    font-size: 11px;
                    line-height: 1.4;
                    font-weight: 700;
                    letter-spacing: .13em;
                    margin-bottom: 10px;
                  }

                  h2 {
                    font-size: 24px !important;
                    line-height: 1.28 !important;
                    font-weight: 620 !important;
                    margin-top: 24px !important;
                    margin-bottom: 12px !important;
                  }

                  h3 {
                    font-size: 18px !important;
                    line-height: 1.4 !important;
                    font-weight: 620 !important;
                    margin-top: 20px !important;
                    margin-bottom: 10px !important;
                  }

                  h4, h5, h6 {
                    font-size: 15px !important;
                    line-height: 1.45 !important;
                    font-weight: 620 !important;
                  }

                  p, li, label {
                    font-size: 14px;
                    line-height: 1.62;
                  }

                  [data-testid="stCaptionContainer"],
                  [data-testid="stCaptionContainer"] p {
                    color: var(--mi-muted) !important;
                    font-size: 12.5px !important;
                    line-height: 1.55 !important;
                    margin-bottom: 10px !important;
                  }

                  div[data-baseweb="tab-list"] {
                    gap: 4px;
                    background: var(--mi-surface);
                    border: 1px solid var(--mi-line);
                    border-radius: var(--mi-radius-lg);
                    padding: 5px;
                    margin-top: 18px;
                    margin-bottom: 20px;
                    box-shadow: 0 1px 2px rgba(0,0,0,.02);
                  }

                  button[data-baseweb="tab"] {
                    min-height: 48px;
                    border-radius: 11px;
                    padding: 6px 15px;
                    color: var(--mi-text-2);
                    font-size: 12.5px;
                    font-weight: 560;
                  }

                  button[data-baseweb="tab"] p {
                    white-space: pre-line !important;
                    line-height: 1.24 !important;
                    text-align: left;
                  }

                  button[data-baseweb="tab"][aria-selected="true"] {
                    background: var(--mi-soft);
                    color: var(--mi-text);
                    font-weight: 650;
                  }

                  button[data-baseweb="tab"][aria-selected="true"] p {
                    color: var(--mi-text) !important;
                  }

                  [data-testid="stMetric"] {
                    background: var(--mi-surface);
                    border: 1px solid var(--mi-line);
                    border-radius: var(--mi-radius-lg);
                    padding: 17px 18px 16px;
                    min-height: 104px;
                    box-shadow: 0 1px 2px rgba(0,0,0,.018);
                  }

                  [data-testid="stMetricLabel"],
                  [data-testid="stMetricLabel"] p {
                    color: var(--mi-muted) !important;
                    font-size: 12.5px !important;
                    line-height: 1.4 !important;
                    font-weight: 520 !important;
                  }

                  [data-testid="stMetricValue"],
                  [data-testid="stMetricValue"] div {
                    color: var(--mi-text) !important;
                    font-size: 27px !important;
                    line-height: 1.25 !important;
                    font-weight: 650 !important;
                    letter-spacing: -0.025em !important;
                  }

                  .stButton > button,
                  .stDownloadButton > button,
                  button[data-testid^="stBaseButton"] {
                    min-height: 42px;
                    border-radius: 999px !important;
                    padding: 0 20px !important;
                    border: 1px solid #dddddd;
                    background: var(--mi-surface);
                    color: var(--mi-text);
                    font-size: 13px;
                    font-weight: 620;
                    box-shadow: none;
                    transition: border-color 120ms ease, background 120ms ease;
                  }

                  .stButton > button:hover,
                  .stDownloadButton > button:hover,
                  button[data-testid^="stBaseButton"]:hover {
                    border-color: #c8c8c8;
                    background: #fafafa;
                  }

                  button[data-testid="stBaseButton-primary"],
                  .stButton > button[kind="primary"] {
                    background: var(--mi-text) !important;
                    color: #ffffff !important;
                    border-color: var(--mi-text) !important;
                  }

                  button[data-testid="stBaseButton-primary"]:hover,
                  .stButton > button[kind="primary"]:hover {
                    background: #303030 !important;
                    border-color: #303030 !important;
                  }

                  [data-baseweb="input"] > div,
                  [data-baseweb="select"] > div,
                  [data-baseweb="textarea"] > div {
                    min-height: 44px;
                    border-radius: var(--mi-radius-md) !important;
                    border-color: var(--mi-line) !important;
                    background: var(--mi-surface) !important;
                    box-shadow: none !important;
                  }

                  [data-baseweb="input"] > div:focus-within,
                  [data-baseweb="select"] > div:focus-within,
                  [data-baseweb="textarea"] > div:focus-within {
                    border-color: rgba(255,105,0,.72) !important;
                    box-shadow: 0 0 0 3px rgba(255,105,0,.08) !important;
                  }

                  [data-testid="stFileUploader"] section {
                    border: 1px dashed #d7d7d7;
                    border-radius: var(--mi-radius-lg);
                    background: rgba(255,255,255,.72);
                    padding: 18px;
                  }

                  [data-testid="stAlert"] {
                    border-radius: var(--mi-radius-md);
                    border-width: 1px;
                    box-shadow: none;
                  }

                  [data-testid="stExpander"],
                  [data-testid="stForm"] {
                    background: var(--mi-surface);
                    border: 1px solid var(--mi-line) !important;
                    border-radius: var(--mi-radius-lg) !important;
                    box-shadow: none;
                  }

                  [data-testid="stForm"] {
                    padding: 20px;
                  }

                  [data-testid="stDataFrame"] {
                    border: 1px solid var(--mi-line);
                    border-radius: var(--mi-radius-lg);
                    overflow: hidden;
                    background: var(--mi-surface);
                  }

                  [data-testid="stPlotlyChart"] {
                    background: var(--mi-surface);
                    border: 1px solid var(--mi-line);
                    border-radius: var(--mi-radius-lg);
                    padding: 8px;
                  }

                  hr { border-color: var(--mi-line) !important; }

                  a {
                    color: var(--mi-text);
                    text-decoration-color: rgba(255,105,0,.55);
                    text-underline-offset: 3px;
                  }

                  @media (max-width: 900px) {
                    .block-container {
                      padding-top: 22px;
                      padding-left: 18px;
                      padding-right: 18px;
                    }
                    div[data-baseweb="tab-list"] {
                      overflow-x: auto;
                      flex-wrap: nowrap;
                    }
                    [data-testid="stMetric"] { min-height: 96px; }
                  }
                  </style>
                  """,
                  unsafe_allow_html=True,
              )
          PY

          cat > docs/UI_VISUAL_SYSTEM.md <<'MD'
          # UI Visual System

          ## Positioning

          The presentation layer is **Xiaomi / HyperOS inspired**, not an official Xiaomi design system and not a brand imitation. It translates public design principles — clear hierarchy, comfortable reading, restrained surfaces and visual rhythm — into an enterprise decision-support dashboard.

          No Xiaomi logo, trademark treatment, proprietary asset, or bundled font file is used.

          ## Typography

          Font stack: `MiSans → Inter → SF Pro Display → Segoe UI → PingFang SC → Microsoft YaHei → Arial`.

          MiSans is used only when already available on the viewer's system. The repository does not bundle font files.

          | Layer | Size | Weight | Use |
          |---|---:|---:|---|
          | Product title | 31–39 px | 650 | Page identity |
          | Section title | 24 px | 620 | Major section |
          | Subsection | 18 px | 620 | Local hierarchy |
          | Body | 14 px | 400–500 | Main content |
          | Label / KPI label | 12.5–13 px | 520 | Supporting information |
          | KPI value | 27 px | 650 | Decision signal |

          ## Layout

          - Maximum content width: **1480 px**
          - Desktop side padding: **20–52 px responsive**
          - Top padding: **34 px**
          - Bottom padding: **64 px**
          - Primary spacing rhythm: **8 / 12 / 16 / 24 / 32 px**

          ## Surfaces

          - Background `#F7F7F7`
          - Primary surface `#FFFFFF`
          - Selected surface `#F2F2F2`
          - Main text `#191919`
          - Secondary text `#5F5F5F`
          - Muted text `#8A8A8A`
          - Border `#E8E8E8`
          - Accent `#FF6900`, used sparingly

          ## Components

          - Cards: 16–20 px radius, thin border, almost no shadow
          - Buttons: pill shape, 42 px minimum height
          - Inputs: 44 px minimum height, 12 px radius, subtle orange focus ring
          - Tabs: white segmented surface, light selected state, existing bilingual naming preserved
          - Tables and charts: white surface, thin border, 16 px radius
          - File uploader: dashed neutral border and light surface

          ## Guardrail

          This system governs **presentation only**. It does not change scoring, policy resolution, risk, governance, target rationale, persistence, or AI decision boundaries.
          MD

          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')

          import_anchor = 'from channel_governance.validation import require_valid_dataframe\n'
          import_line = 'from channel_governance.ui_theme import apply_visual_theme\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Could not find UI import anchor')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          config_line = 'st.set_page_config(page_title="Adaptive Channel Governance", page_icon="◈", layout="wide")\n'
          themed = config_line + 'apply_visual_theme()\n'
          if themed not in text:
              if config_line not in text:
                  raise SystemExit('Could not find set_page_config line')
              text = text.replace(config_line, themed, 1)

          app.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression suite
        run: python -m pytest

      - name: Compile
        run: python -m compileall -q app.py src

      - name: Streamlit health check
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$pid" || true
          if [ "$ok" -ne 1 ]; then
            cat /tmp/streamlit.log
            exit 1
          fi

      - name: Commit visual system
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Felix-0521'
          git config user.email 'felixfan0521@outlook.com'
          git add app.py src/channel_governance/ui_theme.py docs/UI_VISUAL_SYSTEM.md
          git diff --cached --check
          git commit -m 'feat: add xiaomi-inspired visual system'
          git push origin HEAD:feature/xiaomi-inspired-ui
