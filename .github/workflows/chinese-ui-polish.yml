name: Chinese-first UI polish

on:
  push:
    branches:
      - feature/chinese-first-ui

permissions:
  contents: write

jobs:
  verify:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/chinese-first-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply display-layer patch once
        shell: bash
        run: |
          if grep -q "from channel_governance.display_labels import" app.py; then
            echo "Chinese-first display layer already applied; skipping patch."
          else
            python tools/chinese_ui_patch.py
          fi
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full regression suite
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q app.py src
      - name: Streamlit health
        shell: bash
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" || true
          test "$ok" = 1 || { cat /tmp/streamlit.log; exit 1; }
      - name: Commit localized UI if needed
        shell: bash
        run: |
          git config user.name 'Felix-0521'
          git config user.email 'felixfan0521@outlook.com'
          git add app.py src/channel_governance/ui_theme.py src/channel_governance/display_labels.py tests/test_active_dataset_ui.py tests/test_display_labels.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m 'feat: add Chinese-first management interface'
            git push origin HEAD:feature/chinese-first-ui
          fi
